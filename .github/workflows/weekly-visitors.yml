name: Weekly visitors

# Every Monday morning (Bahrain time), posts last week's numbers as an issue.
# Each source is optional and needs repository secrets:
#   Cloudflare Web Analytics  CF_ANALYTICS_TOKEN  (API token: Account → Account Analytics → Read)
#   Google Analytics 4        GOOGLE_SA_KEY (service-account JSON) + GA4_PROPERTY_ID (numeric)
#   Google Search Console     GOOGLE_SA_KEY (+ optional repo variable GSC_SITE, default sc-domain:wacns.com)
# With no secrets set it skips quietly.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Google client
        run: pip install --quiet google-auth requests

      - name: Build the report
        env:
          CF_API_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE: ${{ vars.GSC_SITE }}
        run: python3 tools/weekly_visitors.py > report.md

      - name: Post it as an issue
        run: |
          if [ ! -s report.md ]; then echo "No report (token missing?)"; exit 0; fi
          gh label create weekly-report --color 8A2BE2 --description "Weekly visitor report" 2>/dev/null || true
          for n in $(gh issue list --label weekly-report --state open --json number --jq '.[].number'); do
            gh issue close "$n"
          done
          gh issue create --label weekly-report --title "$(head -1 report.md | sed 's/^# //')" --body-file report.md
